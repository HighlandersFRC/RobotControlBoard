[platformio]
default_envs = front_loader

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino, espidf
board_build.f_cpu = 160000000L
board_build.esp-idf.sdkconfig_path = ${platformio.workspace_dir}/sdkconfig.pesto_test
monitor_speed = 115200

[env:front_loader]
lib_deps = arduino-libraries/ArduinoBLE@2.1.0

[env:balancing_robot]
build_flags = -DBALANCING_ROBOT
lib_deps = arduino-libraries/ArduinoBLE@2.1.0

[env:butterfly]
build_flags = -DBUTTERFLY_KIT

[env:dragon]
build_flags = -DDRAGON_KIT